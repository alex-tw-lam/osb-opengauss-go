# Service plans offered by the broker.
#
# This file is DATA: each deployment (lab / staging / prod) carries its own
# copy. Changes take effect on broker restart.
#
# Plan ids are referenced by platforms once instances exist on a plan,
# so never rename or reuse an id; add a new plan instead.

[[plan]]
id = "gaussdb-dev"
name = "dev"
description = "Small logical database for development and CI."
storage_gb = 5        # tablespace MAXSIZE
max_connections = 20  # database CONNECTION LIMIT

[[plan]]
id = "gaussdb-standard"
name = "standard"
description = "Standard logical database for production workloads."
storage_gb = 50
max_connections = 100

[[plan]]
id = "gaussdb-pro"
name = "pro"
description = "Large logical database with high connection numbers."
storage_gb = 200
max_connections = 500
